<div class="container">

  <h1>User Presence Status</h1>

  <div class="user-card" *ngFor="let user of users">

    <div
      class="status"
      [ngClass]="user.online ? 'online' : 'offline'">
    </div>

    <p>
      {{ user.name }} -
      {{ user.online ? 'Online' : 'Offline' }}
    </p>

  </div>

</div>
