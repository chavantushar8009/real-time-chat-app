<div class="container">

  <h1>Chat File Upload</h1>

  <input
    type="file"
    (change)="onFileSelected($event)"
  >

  <div class="file-list">

    <h3>Uploaded Files</h3>

    <div
      class="file-item"
      *ngFor="let file of uploadedFiles">

      {{ file }}

    </div>

  </div>

</div>
