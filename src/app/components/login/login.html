<div class="login-page">

  <div class="login-card">

    <h1>Welcome Back</h1>

    <p>Login to continue chatting</p>

    <input
      type="text"
      [(ngModel)]="username"
      placeholder="Username"
    >

    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Password"
    >

    <button (click)="login()">
      Login
    </button>

  </div>

</div>
